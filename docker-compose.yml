services:
  postgres:
    image: postgres:16-alpine
    container_name: fuel-planner-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fuel_planner
      POSTGRES_PASSWORD: fuel_planner_dev
      POSTGRES_DB: fuel_planner
    ports:
      - "5432:5432"
    volumes:
      - fuel_planner_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuel_planner -d fuel_planner"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fuel_planner_pgdata:
